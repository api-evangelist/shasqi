name: Shasqi
description: Shasqi is a clinical-stage biotechnology company advancing cancer treatment through
  click chemistry. Its CAPAC (Click Activated Protodrugs Against Cancer) platform uses a
  pre-targeting approach that captures therapeutic payloads at the tumor via in-vivo click
  chemistry, separating tumor-targeting molecules from their drug payloads and reuniting them
  at the cancer site to maximize drug delivery while reducing systemic toxicity. The company
  builds on the 2022 Nobel Prize-winning click chemistry work and operates as a therapeutics
  developer rather than a technology or API platform. Added to the API Evangelist network as a
  Y Combinator portfolio company; enrichment found no public developer API, SDK, or technical
  platform surface.
